<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>滑雪俱乐部 · 维护后台</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="login" class="login-wrap">
  <form class="login-card" onsubmit="return login(event)">
    <div class="login-logo">雪</div>
    <h1>滑雪俱乐部维护后台</h1>
    <p class="login-sub">请输入管理员账号密码</p>
    <label>账号<input id="loginUser" type="text" value="admin" autocomplete="username"></label>
    <label>密码<input id="loginPass" type="password" autocomplete="current-password"></label>
    <button class="btn primary" type="submit">登 录</button>
    <p id="loginErr" class="err"></p>
  </form>
</div>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">雪</span><span>滑雪俱乐部</span></div>
    <nav id="nav">
      <button class="nav-item active" data-view="overview">数据总览</button>
      <button class="nav-item" data-view="members">会员管理</button>
      <button class="nav-group">内容管理</button>
      <button class="nav-item sub" data-table="carpool_posts">滑雪搭子</button>
      <button class="nav-item sub" data-table="trip_activities">俱乐部参团</button>
      <button class="nav-item sub" data-table="coaches">教练平台</button>
      <button class="nav-item sub" data-table="gear_items">二手交易</button>
      <button class="nav-group">业务记录</button>
      <button class="nav-item sub" data-table="trip_orders">参团订单</button>
      <button class="nav-item sub" data-table="carpool_signups">拼车报名</button>
      <button class="nav-item sub" data-table="coach_bookings">课程预约</button>
      <button class="nav-item" data-view="settings">收款配置</button>
    </nav>
    <div class="sidebar-foot"><button class="btn ghost" onclick="logout()">退出登录</button></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h2 id="viewTitle">数据总览</h2>
      <span id="topInfo" class="muted"></span>
    </header>
    <div id="content" class="content"></div>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head"><h3 id="modalTitle">编辑</h3><button class="icon-btn" onclick="closeModal()">×</button></div>
    <div id="modalBody" class="modal-body"></div>
    <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn primary" id="modalSave">保存</button></div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>

<script src="./app.js"></script>
</body>
</html>
